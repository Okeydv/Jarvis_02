# Проверка Джарвиса на настоящей Windows (GitHub Actions, windows-latest):
#   tests      — автотесты на Python 3.10 и 3.12;
#   pc-control — инструменты по-настоящему управляют Windows, голос через виртуальный
#                аудиокабель VB-CABLE, окно целиком (голосовая команда → Блокнот → подтверждение);
#   ollama     — настоящая языковая модель (Ollama) открывает и закрывает Блокнот.
name: Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Автотесты (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Зависимости (как install.bat)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest ruff
      - name: Проверка кода (ruff)
        run: ruff check --select E,F,W,B --ignore E501,B905 jarvis tests main.py download_models.py
      - name: Автотесты
        run: python -m pytest -q -rs

  pc-control:
    name: Управление ПК, голос и окно на Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Модели Vosk и Silero (download_models.py)
        run: python download_models.py --vosk --silero
      - name: Виртуальный аудиокабель VB-CABLE вместо микрофона
        continue-on-error: true
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          $zip = Join-Path $env:RUNNER_TEMP "vbcable.zip"
          $dir = Join-Path $env:RUNNER_TEMP "vbcable"
          Invoke-WebRequest "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          foreach ($cat in Get-ChildItem $dir -Filter "vbaudio_cable64_win*.cat") {
            $cert = (Get-AuthenticodeSignature $cat.FullName).SignerCertificate
            if ($cert) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher", "LocalMachine")
              $store.Open("ReadWrite"); $store.Add($cert); $store.Close()
            }
          }
          $setup = Start-Process -FilePath (Join-Path $dir "VBCABLE_Setup_x64.exe") -ArgumentList "-i", "-h" -PassThru
          if (-not $setup.WaitForExit(180000)) { $setup.Kill(); Write-Host "Установщик не завершился за 3 минуты" }
          Start-Sleep -Seconds 5
          Restart-Service Audiosrv -Force
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize
      - name: Доступ классических программ к микрофону (как в «Параметры → Конфиденциальность → Микрофон»)
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged")
          foreach ($key in $keys) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value "Allow" -Type String
          }
          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy"
          New-Item -Path $policy -Force | Out-Null
          Set-ItemProperty -Path $policy -Name LetAppsAccessMicrophone -Value 1 -Type DWord
          Restart-Service Audiosrv -Force
      - name: Звуковые устройства
        run: |
          python -c "import sounddevice as sd; print(sd.query_devices()); print('по умолчанию:', sd.default.device)"
          python -c "import sounddevice as sd`ntry:`n    s = sd.RawInputStream(samplerate=44100, channels=1, dtype='int16'); s.start(); print('Микрофон по умолчанию открывается:', s.device); s.close()`nexcept Exception as e:`n    print('Микрофон по умолчанию НЕ открывается:', e)"
      - name: Проверки на Windows (tests/windows)
        env:
          JARVIS_WINDOWS_E2E: "1"
          JARVIS_ARTIFACTS: ${{ github.workspace }}\ci_artifacts
        run: python -m pytest tests/windows -v -rs -s --durations=10
      - name: Диагностика (python main.py --check)
        if: always()
        continue-on-error: true
        run: python main.py --check
      - name: Снимки экрана и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pc-control
          path: |
            ci_artifacts/
            logs/
          if-no-files-found: ignore

  ollama:
    name: Настоящая модель (Ollama) управляет Windows
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      JARVIS_OLLAMA_MODEL: qwen3:4b-instruct  # «qwen3:4b» в Ollama — думающая версия, она медленная
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt pytest
      - name: Ollama и модель
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "OllamaSetup.exe"
          Invoke-WebRequest "https://ollama.com/download/OllamaSetup.exe" -OutFile $installer
          # -Wait в PowerShell 7 ждёт и запущенную установщиком Ollama — ждём только сам установщик
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -PassThru
          if (-not $setup.WaitForExit(600000)) { throw "Установщик Ollama не завершился за 10 минут" }
          $ollama = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
          $ready = $false
          for ($i = 0; $i -lt 30 -and -not $ready; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:11434/api/version | Out-Null; $ready = $true }
            catch {
              if ($i -eq 5) { Start-Process $ollama -ArgumentList "serve" -WindowStyle Hidden }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) { throw "Ollama не запустилась" }
          & $ollama pull $env:JARVIS_OLLAMA_MODEL 2>&1 | Select-Object -Last 3
          & $ollama list
      - name: Модель выполняет команды
        env:
          JARVIS_WINDOWS_E2E: "1"
        run: python -m pytest tests/windows/test_ollama_agent.py -v -rs -s
